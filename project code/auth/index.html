<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>JobsWeb - Login / Register</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <h1>JOBS FOR SOFTWARE</h1>

    <form id="authForm">

        <p>Enter username</p>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="username..."
            required
        >

        <p>Enter password</p>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="password..."
            required
        >

        <br><br>

        <input
            type="radio"
            id="company_user"
            name="user_type"
            value="company"
            checked
        >
        <label for="company_user">Company</label>

        <input
            type="radio"
            id="personal_user"
            name="user_type"
            value="personal"
        >
        <label for="personal_user">Personal</label>

        <br><br>

        <button type="submit" id="signInBtn">
            Sign In
        </button>

        <button type="submit" id="signUpBtn">
            Sign Up
        </button>

    </form>

    <script src="script.js"></script>

</body>
</html>
